<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Artigo de Faaaaall." />
    <title>título do post — Faaaaall</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #000;
        --ink: #f6f6f6;
        --muted: #c9c9c9;
        --focus: #a8a7ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--page);
      }

      body {
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .article-page {
        position: relative;
        width: min(100% - 2rem, 72rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3rem) 0 5rem;
      }

      .back {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        color: var(--ink);
        font-weight: 650;
        text-decoration: none;
      }

      .back:hover {
        color: var(--focus);
      }

      .back:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      article {
        max-width: 68ch;
        margin: clamp(3rem, 12vh, 8rem) auto 0;
      }

      .article-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(8rem, 17vw, 13rem);
        align-items: start;
        gap: clamp(1rem, 3vw, 2.5rem);
      }

      .article-layout > article {
        min-width: 0;
      }

      .article-side-gif {
        position: sticky;
        top: 1.5rem;
        width: 100%;
        margin-top: clamp(3rem, 12vh, 8rem);
      }

      .article-side-gif img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        line-height: 1.08;
      }

      .article-body {
        margin-top: 2rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .article-body p {
        margin: 0 0 1.25rem;
      }

      @media (max-width: 48rem) {
        .article-page {
          width: min(100% - 1.25rem, 54rem);
        }

        .article-layout {
          grid-template-columns: 1fr;
        }

        .article-layout > article {
          grid-row: 2;
        }

        .article-side-gif {
          grid-row: 1;
          position: static;
          width: min(12rem, 50vw);
          margin: 1.5rem 0 0 auto;
        }
      }

    </style>
  </head>
  <body>
    <main class="article-page">
      <a class="back" href="../../#posts">← voltar</a>
      <div class="article-layout">
        <article>
          <!-- Substitua este título e estes parágrafos pelo conteúdo do artigo. -->
          <h1>título do post</h1>
          <div class="article-body">
            <p>a ser preenchido</p>
          </div>
        </article>

        <aside class="article-side-gif" aria-hidden="true">
          <img src="../../assets/article-side.gif" alt="" />
        </aside>
      </div>
    </main>
  </body>
</html>
