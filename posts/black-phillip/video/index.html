<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>...</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        min-height: 100vh;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .video-page {
        display: grid;
        width: min(100% - 2rem, 64rem);
        min-height: 100vh;
        align-content: center;
        gap: 1.25rem;
        margin: 0 auto;
        padding: 2rem 0;
      }

      video {
        display: block;
        width: 100%;
        max-height: 72vh;
        background: #000;
        pointer-events: none;
      }

      .cipher-copy {
        margin: 0;
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(0.88rem, 2vw, 1rem);
        line-height: 1.55;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="video-page">
      <video
        id="black-phillip-video"
        autoplay
        playsinline
        preload="auto"
        tabindex="-1"
        aria-hidden="true"
      >
        <source
          src="../../../assets/black-phillip/black-phillip.mp4"
          type="video/mp4"
        />
        Seu navegador não consegue reproduzir este vídeo.
      </video>
      <p class="cipher-copy">Oxyiayal holdo, od zirom o coraxo dis zildar Raasy, od Vabzir camliax, od bahal.
Niiso!
Salman teloch, casarman hoiq, od t i ta Z soba cormf I GA.
Niiso!
Bagle abrang noncp.
Zacar ece od zamran.
 Odo cicle qaa! Zorge lap zirdo noco Mad, hoath laida.</p>
    </main>
    <script>
      const video = document.querySelector("#black-phillip-video");

      const startWithAudio = () => {
        video.muted = false;
        video.volume = 1;

        video.play().catch(() => {
          // Alguns navegadores exigem mais uma interação após a navegação.
          document.addEventListener("pointerdown", startWithAudio, {
            once: true,
          });
          document.addEventListener("keydown", startWithAudio, { once: true });
        });
      };

      startWithAudio();

      video.addEventListener("ended", () => {
        window.location.replace("../../../index.html");
      });
    </script>
  </body>
</html>
