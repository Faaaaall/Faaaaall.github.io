<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>...</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        min-height: 100vh;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      [hidden] {
        display: none !important;
      }

      .directions {
        display: grid;
        min-height: 100vh;
        grid-template-rows: 1fr 1fr;
      }

      .arrow {
        display: grid;
        place-items: center;
        color: #fff;
        font-size: clamp(3rem, 9vw, 5rem);
        line-height: 1;
        text-decoration: none;
      }

      .arrow:hover {
        color: #d7d7d7;
      }

      .arrow:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -8px;
      }

      .video-page {
        display: grid;
        width: min(100% - 2rem, 64rem);
        min-height: 100vh;
        align-content: center;
        gap: 1.25rem;
        margin: 0 auto;
        padding: 2rem 0;
      }

      video {
        display: block;
        width: 100%;
        max-height: 72vh;
        background: #000;
        pointer-events: none;
      }

      .cipher-copy {
        margin: 0;
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(0.88rem, 2vw, 1rem);
        line-height: 1.55;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="directions" class="directions" aria-label="Escolha uma direção">
      <a
        id="open-video"
        class="arrow"
        href="video/"
        aria-label="Subir para assistir ao vídeo"
      >↑</a>
      <a class="arrow" href="../../" aria-label="Descer e voltar à página principal">↓</a>
    </main>

    <main id="video-scene" class="video-page" hidden>
      <video
        id="black-phillip-video"
        playsinline
        preload="auto"
        tabindex="-1"
        aria-hidden="true"
      >
        <source
          src="../../assets/black-phillip/black-phillip.mp4"
          type="video/mp4"
        />
        Seu navegador não consegue reproduzir este vídeo.
      </video>
      <p class="cipher-copy">Oxyiayal holdo, od zirom o coraxo dis zildar Raasy, od Vabzir camliax, od bahal.
Niiso!
Salman teloch, casarman hoiq, od t i ta Z soba cormf I GA.
Niiso!
Bagle abrang noncp.
Zacar ece od zamran.
 Odo cicle qaa! Zorge lap zirdo noco Mad, hoath laida.</p>
    </main>

    <script>
      const directions = document.querySelector("#directions");
      const videoScene = document.querySelector("#video-scene");
      const openVideo = document.querySelector("#open-video");
      const video = document.querySelector("#black-phillip-video");

      const showDirections = () => {
        video.pause();
        videoScene.hidden = true;
        directions.hidden = false;
      };

      const showVideo = ({ updateUrl }) => {
        video.muted = false;
        video.volume = 1;

        if (video.readyState > HTMLMediaElement.HAVE_NOTHING) {
          video.currentTime = 0;
        }

        // Essa chamada acontece dentro do clique da seta, então o navegador
        // permite a reprodução com áudio sem mostrar controles.
        video.play().catch(() => {});

        directions.hidden = true;
        videoScene.hidden = false;

        if (updateUrl) {
          history.pushState({ blackPhillip: "video" }, "", "video/");
        }
      };

      openVideo.addEventListener("click", (event) => {
        event.preventDefault();
        showVideo({ updateUrl: true });
      });

      window.addEventListener("popstate", (event) => {
        if (event.state?.blackPhillip === "video") {
          showVideo({ updateUrl: false });
          return;
        }

        showDirections();
      });

      video.addEventListener("ended", () => {
        window.location.replace("../../");
      });
    </script>
  </body>
</html>
